apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: {{ include "task-tracker.namespace" . }}
spec:
  accessModes: ["{{ .Values.mongo.persistence.accessMode }}"]
  resources:
    requests:
      storage: {{ .Values.mongo.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: {{ include "task-tracker.namespace" . }}
spec:
  replicas: 1
  # Required for any single-instance database: fully stop the old pod
  # before starting a new one, so they never contend for the same data dir.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: {{ .Values.mongo.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mongo.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mongo.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: {{ include "task-tracker.namespace" . }}
spec:
  selector: { app: mongo }
  ports:
    - port: 27017
      targetPort: 27017
