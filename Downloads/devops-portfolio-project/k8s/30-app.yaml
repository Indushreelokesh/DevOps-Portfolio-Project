apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker
  namespace: task-tracker
spec:
  replicas: 2
  selector:
    matchLabels: { app: task-tracker }
  template:
    metadata:
      labels: { app: task-tracker }
    spec:
      containers:
        - name: task-tracker
          # For a local kind cluster without a registry, build with the same
          # tag and `kind load docker-image task-tracker:local` (see README).
          image: task-tracker:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: task-tracker-config
          readinessProbe:
            httpGet: { path: /ready, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: task-tracker
  namespace: task-tracker
spec:
  type: ClusterIP
  selector: { app: task-tracker }
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-tracker
  namespace: task-tracker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-tracker
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
